[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pkb-agent"
version = "0.1.0"
description = "Supabase-backed ReAct personal knowledge base agent (DeepSeek + pgvector + FTS)"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "pkb-agent" }]

dependencies = [
  "fastapi>=0.115",
  "typer>=0.12.3",
  "rich>=13.7",
  "pydantic>=2.7",
  "pydantic-settings>=2.3",
  "supabase>=2.6",
  "httpx>=0.27",
  "dashscope>=1.26.6",
  "socksio>=1.0",
  "tenacity>=8.3",
  "beautifulsoup4>=4.12",
  "lxml>=5.2",
  "tiktoken>=0.7",
  "PyYAML>=6.0",
  "python-dotenv>=1.0",
  "python-multipart>=0.0.9",
  "pypdf>=4.0",
  "uvicorn[standard]>=0.30",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.2",
  "pytest-asyncio>=0.23",
  "pytest-cov>=5.0",
  "respx>=0.21",
  "ruff>=0.5",
  "mypy>=1.10",
  "types-PyYAML",
]

[project.scripts]
pkb-agent = "pkb_agent.app.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/pkb_agent"]

[tool.hatch.build.targets.sdist]
include = ["src/pkb_agent", "config", "supabase", "README.md", "LICENSE"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B011"]
"src/pkb_agent/app/cli.py" = ["B008"]
"src/pkb_agent/tools/*" = ["RUF012"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-ra"

[tool.mypy]
python_version = "3.12"
packages = ["pkb_agent"]
strict = false
ignore_missing_imports = true
disallow_untyped_defs = false
