# Default runtime configuration for pkb-agent.
# Values here are overrides/defaults; environment variables take precedence
# (see src/pkb_agent/app/settings.py).

agent:
  max_steps: 20
  tool_result_max_chars: 6000
  temperature: 0.2
  # Invalid final JSON/citations get this many repair attempts before a
  # deterministic insufficient-evidence refusal is returned.
  answer_verification_max_retries: 2
  # Stop retrieving slightly before max_steps and make a no-tool final JSON
  # attempt. This avoids turning repeated searches/reads into max-step errors.
  finalization_reserve_steps: 3
  # Passed as max_tokens with DeepSeek JSON Output so final JSON is not
  # truncated mid-object. Override with AGENT_JSON_OUTPUT_MAX_TOKENS if needed.
  json_output_max_tokens: 4096
  # Hard ceiling on a single tool result before truncation kicks in.

rag:
  top_k: 6
  rrf_k: 60
  chunk_size: 800        # target characters per chunk
  chunk_overlap: 120     # overlap between adjacent chunks
  min_query_len: 2
  # Hybrid weights: vector similarity vs full-text search contribution.
  vector_weight: 0.6
  fts_weight: 0.4

evaluation:
  # For document-level benchmark metrics, retrieve this many chunks per K and
  # retain the first chunk from each distinct source document.
  document_candidate_multiplier: 3

embedding:
  # qwen3.7-text-embedding allows at most 20 input strings per request.
  batch_size: 20
  timeout: 60

web:
  search_provider: tavily
  fetch_timeout: 20
  max_results: 5
  fetch_max_chars: 8000
  # Web pages become citation-eligible only after web_fetch. Their provenance
  # retains this freshness window.
  evidence_ttl_hours: 168
  # Exact domains and their subdomains get high trust; other HTTPS pages are
  # medium and plain HTTP pages are low.
  trusted_domains: []

memory:
  max_results: 5
  # Short-term: per run; long-term: cross-run persistent notes.
  default_scope: long
  max_content_chars: 4000
  # Secret-looking content is rejected before it can be persisted.
  reject_secrets: true

prompts:
  # Set to an absolute path only when replacing the bundled prompt manifest.
  manifest_path: ""
  query_rewrite:
    enabled: true
    max_queries: 3

permissions:
  # A row in tool_permissions replaces the same tool's YAML rule.
  db_overrides_enabled: true
  # 0 refreshes before every tool call; raise this to reduce DB reads in long-lived runtimes.
  refresh_seconds: 0

trace:
  enabled: true
  redact_secrets: true
  # Trace writes are retried only for transient storage/transport failures.
  # After these attempts, the answer still completes and the run records a
  # trace-write failure instead of becoming an Agent execution failure.
  retry_attempts: 3
  retry_backoff_seconds: 0.25

# HTTP/SSE API for external clients. Clients handle `ask`-permission approvals.
# Add an origin here when connecting a browser-based GUI.
api:
  allowed_origins: []
  approval_timeout_seconds: 300

# Avoid accidentally routing database requests through a stale shell/editor
# proxy such as 127.0.0.1:7897. Set true only when Supabase must use a proxy.
supabase:
  trust_env: false
  # Applies to PostgREST reads/writes; corpus --timeout controls only upstream downloads.
  timeout: 60

# Cost is an estimate, not a provider invoice. These are the DeepSeek V4 Flash
# CNY rates supplied for this workspace, in CNY per one million tokens. Change
# them whenever the model or account contract changes.
observability:
  currency: CNY
  cache_hit_input_token_cost_per_million: 0.02
  cache_miss_input_token_cost_per_million: 1.0
  output_token_cost_per_million: 2.0
